[versions]
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.9"
dokka = "2.2.0"
maven-publish = "0.37.0"
rovo89-xposed-api = "82"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
hiddenapibypass = "6.1"
auto-service-annotations = "1.1.1"
auto-service-ksp = "1.2.0"
kotlinpoet = "2.3.0"
kavaref-bom = "1.1.0"
hikage-bom = "1.1.1"
hikage-plugin = "1.0.1"
betterandroid-android-bom = "1.1.6"
androidx-annotation = "1.10.0"
androidx-preference-ktx = "1.2.1"
# The project current support min sdk version is 21,
# suppress the warning about using newer versions of dependencies that may require higher min sdk version.
# noinspection GradleDependency
androidx-core-ktx = "1.17.0"
# The project current support min sdk version is 21,
# suppress the warning about using newer versions of dependencies that may require higher min sdk version.
# noinspection GradleDependency
androidx-appcompat = "1.7.1"
# The project current support min sdk version is 21,
# suppress the warning about using newer versions of dependencies that may require higher min sdk version.
# noinspection GradleDependency
androidx-lifecycle = "2.9.0"
# noinspection GradleDependency
material = "1.11.0"
androidx-constraintlayout = "2.2.2"
junit = "4.13.2"
android-lint = "32.3.2"
androidx-test-ext-junit = "1.3.0"
androidx-test-espresso-core = "3.7.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
hikage = { id = "com.highcapable.hikage", version.ref = "hikage-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service-api = { module = "io.github.libxposed:interface", version.ref = "libxposed-service" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }
rovo89-xposed-api = { module = "de.robv.android.xposed:api", version.ref = "rovo89-xposed-api" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service-annotations" }
auto-service-ksp = { module = "dev.zacsweers.autoservice:auto-service-ksp", version.ref = "auto-service-ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
kavaref-bom = { group = "com.highcapable.kavaref", name = "kavaref-bom", version.ref = "kavaref-bom" }
kavaref-core = { group = "com.highcapable.kavaref", name = "kavaref-core" }
kavaref-android = { group = "com.highcapable.kavaref", name = "kavaref-android" }
kavaref-extension = { group = "com.highcapable.kavaref", name = "kavaref-extension" }
hikage-bom = { group = "com.highcapable.hikage", name = "hikage-bom", version.ref = "hikage-bom" }
hikage-core = { group = "com.highcapable.hikage", name = "hikage-core" }
hikage-runtime = { group = "com.highcapable.hikage", name = "hikage-runtime" }
hikage-runtime-attribute = { group = "com.highcapable.hikage", name = "hikage-runtime-attribute" }
hikage-extension = { group = "com.highcapable.hikage", name = "hikage-extension" }
hikage-widget-androidx = { group = "com.highcapable.hikage", name = "hikage-widget-androidx" }
hikage-widget-material = { group = "com.highcapable.hikage", name = "hikage-widget-material" }
betterandroid-android-bom = { module = "com.highcapable.betterandroid:android-bom", version.ref = "betterandroid-android-bom" }
betterandroid-ui-component = { module = "com.highcapable.betterandroid:ui-component" }
betterandroid-ui-extension = { module = "com.highcapable.betterandroid:ui-extension" }
betterandroid-system-extension = { module = "com.highcapable.betterandroid:system-extension" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference-ktx" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
junit = { module = "junit:junit", version.ref = "junit" }
android-lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "android-lint" }
android-lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "android-lint" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso-core" }
